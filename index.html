<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c5a45">
<meta name="description" content="Le 3000 : jeu de dés à plusieurs, sur un écran ou depuis chaque téléphone, avec cagnottes et comptes entre joueurs.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='12' fill='%231c5a45'/%3E%3Ccircle cx='20' cy='20' r='6' fill='%23fbf6ea'/%3E%3Ccircle cx='32' cy='32' r='6' fill='%23fbf6ea'/%3E%3Ccircle cx='44' cy='44' r='6' fill='%23fbf6ea'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='12' fill='%231c5a45'/%3E%3Ccircle cx='20' cy='20' r='6' fill='%23fbf6ea'/%3E%3Ccircle cx='32' cy='32' r='6' fill='%23fbf6ea'/%3E%3Ccircle cx='44' cy='44' r='6' fill='%23fbf6ea'/%3E%3C/svg%3E">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}
</style>
<title>Le 3000</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Big+Shoulders+Display:wght@600;800;900&display=swap">
<style>
/* Layout : un plateau de feutre (la piste de dés) au centre du jeu, le tableau des scores
   comme une ardoise de café à côté ; la compta façon carnet de comptes, sobre. */
:root{
  --bg:#eaf0ec; --surface:#ffffff; --surface-2:#f4f7f5; --ink:#15211b; --muted:#5a6a61; --line:#d3ddd6;
  --felt:#1c5a45; --felt-2:#154736; --felt-ink:#eaf5ee; --bone:#fbf6ea; --bone-edge:#d9cfb8; --pip:#1d1a16;
  --gain:#1d8048; --loss:#c03a26; --neg:#6a3db0; --money:#a86b10; --focus:#2563eb;
  --display:"Big Shoulders Display", "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:12px; --shadow:0 1px 2px rgba(20,40,30,.08),0 6px 20px rgba(20,40,30,.07);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1612; --surface:#16211c; --surface-2:#1b2822; --ink:#e6efe9; --muted:#93a59b; --line:#2b3b33;
  --felt:#18503d; --felt-2:#123d2f; --felt-ink:#e6f3eb; --bone:#f3ecdc; --bone-edge:#b9ad93; --pip:#1d1a16;
  --gain:#4fc487; --loss:#f06b55; --neg:#ad8ff2; --money:#e6b456; --focus:#7aa7ff;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1612; --surface:#16211c; --surface-2:#1b2822; --ink:#e6efe9; --muted:#93a59b; --line:#2b3b33;
  --felt:#18503d; --felt-2:#123d2f; --felt-ink:#e6f3eb; --bone:#f3ecdc; --bone-edge:#b9ad93; --pip:#1d1a16;
  --gain:#4fc487; --loss:#f06b55; --neg:#ad8ff2; --money:#e6b456; --focus:#7aa7ff;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);line-height:1;margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-size:1.9rem;font-weight:800}
h3{font-size:1.35rem;font-weight:800}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.gain{color:var(--gain)} .loss{color:var(--loss)} .neg{color:var(--neg)} .money{color:var(--money)}
.label{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;font-weight:700;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn:hover:not(:disabled){border-color:var(--felt)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--felt);border-color:var(--felt);color:var(--felt-ink)}
.btn.primary:hover:not(:disabled){background:var(--felt-2)}
.btn.danger{color:var(--loss);border-color:color-mix(in srgb,var(--loss) 40%,var(--line))}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.92rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
input[type=text],input[type=number],select{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}

/* ---------- En-tête ---------- */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:900;font-size:2.4rem;line-height:.9;letter-spacing:-.01em;background:none;border:0;padding:0;color:var(--ink)}
.brand span{color:var(--felt)}
.top .meta{display:flex;flex-direction:column;min-width:0;flex:1}
.top .meta b{font-size:1rem;overflow-wrap:anywhere}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.8rem;font-weight:700;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.chip.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gain)}
.chip.off::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--loss)}

/* ---------- Accueil ---------- */
.hero{background:var(--felt);color:var(--felt-ink);border-radius:18px;padding:28px 24px;display:grid;grid-template-columns:1.2fr 1fr;gap:24px;align-items:center;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 20% 10%,rgba(255,255,255,.09),transparent 60%);pointer-events:none}
.hero h1{font-size:clamp(4.5rem,15vw,9rem);font-weight:900;line-height:.82}
.hero p{max-width:46ch;opacity:.9}
.hero .dice{justify-content:flex-end}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap;position:relative;z-index:1}
.hero .btn{background:var(--bone);color:#1d1a16;border-color:var(--bone)}
.hero .btn.alt{background:transparent;color:var(--felt-ink);border-color:rgba(255,255,255,.45)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:18px}
.list{display:flex;flex-direction:column}
.list .item{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.list .item:first-child{border-top:0}
.list .item .grow{flex:1;min-width:0}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:10px}
.rule{display:flex;gap:10px;align-items:center;padding:10px;border-radius:10px;background:var(--surface-2)}
.rule b{font-family:var(--display);font-size:1.5rem;font-weight:800;min-width:3.2ch}

/* ---------- Dés ---------- */
.dice{display:flex;gap:clamp(10px,3vw,22px);justify-content:center;align-items:center}
.die{--s:clamp(64px,18vw,104px);width:var(--s);height:var(--s);background:var(--bone);border-radius:18%;
  box-shadow:inset 0 -6px 0 var(--bone-edge),0 8px 18px rgba(0,0,0,.35);display:grid;grid-template-columns:repeat(3,calc(var(--s) * .24));grid-template-rows:repeat(3,calc(var(--s) * .24));justify-content:center;align-content:center;padding:0;transition:transform .25s}
.die i{width:calc(var(--s) * .17);height:calc(var(--s) * .17);border-radius:50%;background:var(--pip);place-self:center;visibility:hidden}
.die.f1 i:nth-child(5),.die.f2 i:nth-child(3),.die.f2 i:nth-child(7),.die.f3 i:nth-child(3),.die.f3 i:nth-child(5),.die.f3 i:nth-child(7),
.die.f4 i:nth-child(1),.die.f4 i:nth-child(3),.die.f4 i:nth-child(7),.die.f4 i:nth-child(9),
.die.f5 i:nth-child(1),.die.f5 i:nth-child(3),.die.f5 i:nth-child(5),.die.f5 i:nth-child(7),.die.f5 i:nth-child(9),
.die.f6 i:nth-child(1),.die.f6 i:nth-child(3),.die.f6 i:nth-child(4),.die.f6 i:nth-child(6),.die.f6 i:nth-child(7),.die.f6 i:nth-child(9){visibility:visible}
.die.f1 i:nth-child(5){background:#b3261e}
.die.blank{opacity:.35}
.die.score{box-shadow:inset 0 -6px 0 var(--bone-edge),0 0 0 4px var(--money),0 8px 18px rgba(0,0,0,.35)}
.rolling .die{animation:tumble .55s cubic-bezier(.3,.7,.4,1) both}
.rolling .die:nth-child(2){animation-delay:.05s}.rolling .die:nth-child(3){animation-delay:.1s}
@keyframes tumble{0%{transform:translate(-40px,-30px) rotate(-200deg) scale(.8)}60%{transform:translate(6px,4px) rotate(18deg) scale(1.05)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){.rolling .die{animation:none}}

/* ---------- Jeu ---------- */
.game{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
.table{background:var(--felt);color:var(--felt-ink);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:18px;box-shadow:var(--shadow);position:relative}
.table .who{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.table .who .name{font-family:var(--display);font-size:clamp(2rem,6vw,3.2rem);font-weight:900;line-height:.9;overflow-wrap:anywhere}
.tag{font-size:.78rem;font-weight:700;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.14)}
.tray{background:var(--felt-2);border-radius:14px;padding:clamp(18px,4vw,32px) 10px;box-shadow:inset 0 2px 12px rgba(0,0,0,.35)}
.verdict{text-align:center;min-height:2.6em;font-weight:700;font-size:1.15rem;display:flex;align-items:center;justify-content:center;flex-direction:column}
.verdict .big{font-family:var(--display);font-size:2.2rem;font-weight:900;line-height:1}
.v-gain{color:#8ff0b6}.v-loss{color:#ffb4a6}.v-money{color:#ffd88a}
.counters{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.counter{background:rgba(0,0,0,.18);border-radius:12px;padding:10px 12px;min-width:0}
.counter .label{color:rgba(234,245,238,.72)}
.counter .v{font-family:var(--display);font-size:clamp(1.8rem,5.5vw,2.6rem);font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.counter .v.negv{color:#d6c2ff}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.actions .btn{min-height:64px;font-size:1.2rem;border-radius:14px}
.actions .roll{background:var(--bone);color:#1d1a16;border-color:var(--bone)}
.actions .bank{background:transparent;color:var(--felt-ink);border:2px solid rgba(255,255,255,.55)}
.actions .bank:not(:disabled):hover{background:rgba(255,255,255,.1)}
.why{font-size:.92rem;color:rgba(234,245,238,.82);text-align:center;min-height:1.4em}
.pot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid rgba(255,255,255,.18);padding-top:12px}
.pot .v{font-family:var(--display);font-size:1.8rem;font-weight:800;color:#ffd88a}
.board{width:100%;border-collapse:collapse}
.board th{text-align:left;font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:0 6px 8px}
.board td{padding:10px 6px;border-top:1px solid var(--line);vertical-align:middle}
.board td.r,.board th.r{text-align:right}
.board tr.on td{background:color-mix(in srgb,var(--felt) 10%,transparent)}
.board .sc{font-family:var(--display);font-size:1.7rem;font-weight:800}
.board .rank{font-family:var(--display);font-weight:800;font-size:1.2rem;color:var(--muted);width:2ch}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}
.pname{display:flex;align-items:center;gap:8px;min-width:0;font-weight:700;overflow-wrap:anywhere}
.bar{height:5px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin-top:4px}
.bar b{display:block;height:100%;background:var(--felt)}
.log{display:flex;flex-direction:column;max-height:340px;overflow:auto}
.log .e{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.log .e:first-child{border-top:0}
.mini{display:flex;gap:3px}
.mini .die{--s:26px;border-radius:6px;box-shadow:inset 0 -2px 0 var(--bone-edge)}

.badge{font-size:.72rem;font-weight:800;padding:2px 8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.badge.loss{background:color-mix(in srgb,var(--loss) 12%,var(--surface));border-color:color-mix(in srgb,var(--loss) 35%,var(--line))}
.badge.gain{background:color-mix(in srgb,var(--gain) 12%,var(--surface));border-color:color-mix(in srgb,var(--gain) 35%,var(--line))}
.badge.money{background:color-mix(in srgb,var(--money) 12%,var(--surface));border-color:color-mix(in srgb,var(--money) 35%,var(--line))}

/* ---------- Compta ---------- */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;white-space:nowrap;min-height:40px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:14px}
.acct{display:flex;flex-direction:column;gap:8px}
.acct .bal{font-family:var(--display);font-size:2.2rem;font-weight:800;line-height:1}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:.95rem}
.kv span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums}
.xfer{display:grid;grid-template-columns:1fr auto 1fr auto;gap:12px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.xfer:first-child{border-top:0}
.xfer .amt{font-family:var(--display);font-size:1.8rem;font-weight:800;color:var(--money)}
.arrow{color:var(--muted);font-size:1.4rem}
.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.scroll{overflow-x:auto}
.ledger{width:100%;border-collapse:collapse;font-size:.93rem;min-width:520px}
.ledger th{text-align:left;color:var(--muted);font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;padding:6px}
.ledger td{padding:8px 6px;border-top:1px solid var(--line)}
.ledger td.r,.ledger th.r{text-align:right;font-variant-numeric:tabular-nums}
details.gm{border-top:1px solid var(--line);padding:12px 0}
details.gm:first-of-type{border-top:0}
details.gm summary{cursor:pointer;display:flex;gap:12px;align-items:center;flex-wrap:wrap;list-style:none}
details.gm summary::-webkit-details-marker{display:none}
details.gm summary .no{font-family:var(--display);font-size:1.5rem;font-weight:800;min-width:3ch}
.struck{text-decoration:line-through;opacity:.6}
.code{font-family:var(--display);font-weight:900;font-size:clamp(2.6rem,9vw,4rem);letter-spacing:.12em;line-height:1}
.order{display:flex;flex-direction:column;gap:8px}
.order .o{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);flex-wrap:wrap}
.order .o.off{opacity:.55}
.order .o .grow{flex:1;min-width:0}
.iconbtn{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;font-weight:800}

/* ---------- Superpositions ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,20,15,.55);display:grid;place-items:center;z-index:50;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:16px;padding:22px;max-width:520px;width:100%;display:flex;flex-direction:column;gap:14px;max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.win{background:var(--felt);color:var(--felt-ink);text-align:center;align-items:center}
.win .big{font-family:var(--display);font-size:clamp(3rem,12vw,5.5rem);font-weight:900;line-height:.9;overflow-wrap:anywhere}
.win .btn{width:100%}
.win .btn.primary{background:var(--bone);color:#1d1a16;border-color:var(--bone)}
.win .btn:not(.primary){background:transparent;color:var(--felt-ink);border-color:rgba(255,255,255,.4)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;font-weight:700;max-width:min(92vw,520px);box-shadow:var(--shadow)}
.flash{animation:flash .9s ease}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(255,216,138,.9)}100%{box-shadow:0 0 0 22px rgba(255,216,138,0)}}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.flash,.shake{animation:none}}

@media (max-width:860px){
  .game{grid-template-columns:1fr}
  .hero{grid-template-columns:1fr}
  .hero .dice{justify-content:flex-start}
}
@media (max-width:520px){
  .counters{gap:6px}.counter{padding:8px}
  .xfer{grid-template-columns:1fr auto 1fr;}
  .xfer .act{grid-column:1/-1}
  .board .hide-sm{display:none}
  .brand{font-size:2rem}
}
</style>

</head>
<body>
<div class="wrap" id="app" aria-live="polite"></div>
<div id="layer"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="firebase-shim.js"></script>

<script src="core.js"></script>
<script src="app.js"></script>

</body>
</html>
